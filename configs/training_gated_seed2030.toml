# Final configuration used in the paper (selected by Optuna, Section 2.6).
# Used for the quality-gated model and, unchanged, for the ablation variants.
[training]
model = "cnn_lstm"
seed = 2030
epochs = 30
batch_size = 96
learning_rate = 0.0006662034366198896
weight_decay = 7.66276127696697e-05
dropout = 0.30
early_stopping_patience = 6
num_workers = 2
calibration_bins = 15
class_weighting = false
